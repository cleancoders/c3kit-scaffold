name: Release

# Authorization comes from the `clojars` environment, not from this file.
# workflow_dispatch cannot be restricted by permission level, so the
# environment's required reviewers decide whether a run proceeds, and its
# master-only deployment branch policy means a modified copy of this file on
# another ref cannot reach the secrets. Do not add an actor allowlist here.
on: workflow_dispatch

permissions:
  contents: write   # push the release tag
  actions: read     # verify-ci! reads ci.yml run history
  id-token: write   # OIDC token the attestation is bound to
  attestations: write  # write the provenance and SBOM attestations

jobs:
  release:
    runs-on: ubuntu-latest
    environment: clojars
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Install Clojure CLI
        uses: DeLaGuardo/setup-clojure@4c7a6f613e5089821bb3bb2a33a3ee115578580d # 13.6.1
        with:
          cli: 'latest'

      - name: Build and publish
        # Use `clojure`, not `clj` -- `clj` wraps rlwrap, which GitHub runners
        # don't have installed, and fails with "Please install rlwrap for
        # command editing or use \"clojure\" instead."
        run: clojure -T:build deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}

      # sbom-path does NOT expand globs the way subject-path above does. Written
      # as a glob it fails with ENOENT -- after the artifact is already live on
      # Clojars, which is unrepairable there.
      - name: Locate the SBOM
        id: sbom
        run: echo "path=$(ls target/*-cyclonedx.json)" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: target/*.jar

      - name: Attest the SBOM
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3
        with:
          subject-path: target/*.jar
          sbom-path: ${{ steps.sbom.outputs.path }}
